name: heatscape

services:
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8180}:80"
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    restart: unless-stopped

  middleware:
    build: ./middleware
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8000
      # MOCK sign-in users until Keycloak (middleware/src/users.js); empty password = cannot sign in.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@heatscape.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PLANNER_EMAIL: ${PLANNER_EMAIL:-planner@heatscape.local}
      PLANNER_PASSWORD: ${PLANNER_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-heatscape}
      POSTGRES_USER: ${POSTGRES_USER:-heatscape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TRANSLATE_URL: http://translate:5000
    # No dependency on translate: the API starts without it; /api/translate returns 503
    # until it is healthy (first start downloads the EN/DE models).
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Open-data imports (backend/app/ingest): DWD warnings, forecast and stations, OSM
  # facilities, Zensus grid, each on its own interval. Same image as the backend; needs
  # outbound internet. No published port.
  worker:
    build: ./backend
    command: ["python", "-m", "app.ingest.schedule"]
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-heatscape}
      POSTGRES_USER: ${POSTGRES_USER:-heatscape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # The loop touches /tmp/heartbeat every minute; a long import (Zensus) may pause it.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/heartbeat') < 600 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  translate:
    build: ./translate
    volumes:
      - lt-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  database:
    build: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heatscape}
      POSTGRES_USER: ${POSTGRES_USER:-heatscape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Localhost only, for DB tools (DBeaver, psql).
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  lt-models:
