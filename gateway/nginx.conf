# Single public entry point. Upstreams resolve lazily through Docker DNS, so the
# gateway starts even when only some services are running.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # API (including Swagger at /api/docs) goes through the middleware.
  location /api/ {
    set $middleware http://middleware:3000;
    proxy_pass $middleware;
  }

  location = /healthz {
    set $middleware http://middleware:3000;
    rewrite ^ /health break;
    proxy_pass $middleware;
  }

  location / {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
  }
}
