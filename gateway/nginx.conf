# Single public entry point. Upstreams resolve lazily through Docker DNS, so the
# gateway starts even when only some services are running.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade (Vite HMR in dev mode; harmless for plain HTTP).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # API (including Swagger at /api/docs) goes through the middleware.
  location /api/ {
    set $middleware http://middleware:3000;
    proxy_pass $middleware;
  }

  location = /healthz {
    set $middleware http://middleware:3000;
    rewrite ^ /health break;
    proxy_pass $middleware;
  }

  # Admin console: only for a session with the admin role (checked by the middleware).
  # Signed out -> sign-in page; signed in without the role -> sign-in page with a notice.
  # Fails closed: no middleware, no console.
  location = /_auth/admin {
    internal;
    set $middleware http://middleware:3000;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_pass $middleware/auth/check/admin;
  }

  location ~ ^/admin(/|$) {
    auth_request /_auth/admin;
    error_page 401 = @signin;
    error_page 403 = @denied;
    set $frontend http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
    proxy_pass $frontend;
  }

  location @signin {
    return 302 /signin?next=/admin;
  }

  location @denied {
    return 302 /signin?next=/admin&denied=admin;
  }

  location / {
    set $frontend http://frontend:80;
    # Any proxy_set_header here stops inheritance, so the server-level ones are repeated.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_pass $frontend;
  }
}
